x-app: &app
  image: ${APP_IMAGE:-ghcr.io/rebelonion/audio-share:latest}
  environment:
    - PORT=8080
    - AUDIO_DIR=/audio:Audio
    - CONTENT_DIR=/app/content
    - STATIC_DIR=/app/static
    - DATABASE_URL=postgres://${DB_USER:-audio_share}:${DB_PASSWORD:-audio_share}@postgres:5432/${DB_NAME:-audio_share}
    - SOURCE_NORMALIZER_SCRIPT=/app/config/source_normalizer.py
  env_file:
    - .env.local
  volumes:
    - ${AUDIO_PATH:-./audio}:/audio:ro
    - ${CONTENT_PATH:-./content}:/app/content:ro
    - ${SOURCE_NORMALIZER_PATH:-/scripts/source_normalizer.py}:/app/config/source_normalizer.py:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-audio_share}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audio_share}
      POSTGRES_DB: ${DB_NAME:-audio_share}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-audio_share}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${APP_IMAGE:-ghcr.io/rebelonion/audio-share:latest}
    command: ["./audio-share-backend", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${DB_USER:-audio_share}:${DB_PASSWORD:-audio_share}@postgres:5432/${DB_NAME:-audio_share}
    restart: "no"

  app:
    <<: *app
    command: ["./audio-share-backend", "serve"]
    restart: unless-stopped
    stop_grace_period: 24h
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *app
    command: ["./audio-share-backend", "worker"]
    restart: unless-stopped
    stop_grace_period: 24h
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  cap:
    image: tiago2/cap:3.1.8
    profiles: ["cap"]
    restart: unless-stopped
    depends_on:
      cap-valkey:
        condition: service_healthy
    ports:
      - "${CAP_PORT:-3000}:3000"
    environment:
      ADMIN_KEY: ${ADMIN_KEY}
      REDIS_URL: redis://cap-valkey:6379

  cap-valkey:
    image: valkey/valkey:9-alpine
    profiles: ["cap"]
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - cap_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  cap_valkey_data:
